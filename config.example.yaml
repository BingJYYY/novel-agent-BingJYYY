# 网文动态大纲智能体 —— 配置文件
# 最简单的方式：设置环境变量，无需修改此文件
#   Windows:  set DEEPSEEK_API_KEY=sk-xxxxxxxx
#   Linux/Mac: export DEEPSEEK_API_KEY=sk-xxxxxxxx
# 或者运行：python main.py config --api-key sk-xxxxxxxx
# 提示词已内置在 extractor/prompt.py 中，开箱即用

# LLM 配置
llm:
  # 可选: deepseek / tongyi / zhipu / openai
  provider: deepseek

  # API 请求超时（秒）
  request_timeout: 120

  # 最大重试次数
  max_retries: 3

  # OpenAI 兼容接口配置（DeepSeek 也用这个）
  openai:
    api_key: "your-api-key-here"
    base_url: "https://api.deepseek.com/v1"
    model: "deepseek-chat"
    temperature: 0.3
    max_tokens: 16000

  # 通义千问（阿里）
  # tongyi:
  #   api_key: "your-api-key-here"
  #   model: "qwen-plus"
  #   temperature: 0.3
  #   max_tokens: 16000

  # 智谱 GLM
  # zhipu:
  #   api_key: "your-api-key-here"
  #   model: "glm-4"
  #   temperature: 0.3
  #   max_tokens: 16000

# 小说配置
novel:
  protagonist: ""

# 数据库配置
database:
  path: "novel.db"


  # 自定义 OpenAI 兼容接口（任意 OpenAI 兼容服务商 / 代理 / Ollama 本地服务等）
  # 在「设置」面板里选 “自定义 (OpenAI 兼容)” 填写，或运行：
  #   python main.py config --provider custom --base-url https://api.moonshot.cn/v1 --api-key sk-xxx --model moonshot-v1-8k
  #   python main.py config --provider custom --base-url http://localhost:11434/v1  --model qwen2.5:7b
  # custom:
  #   api_key: "your-api-key-here"   # Ollama 等本地服务可填任意非空字符串
  #   base_url: "https://api.moonshot.cn/v1"
  #   model: "moonshot-v1-8k"
  #   temperature: 0.3
  #   max_tokens: 16000