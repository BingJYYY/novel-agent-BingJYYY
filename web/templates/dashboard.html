<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网文动态大纲仪表盘</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #0f1923; color: #e0e0e0; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 16px 24px; border-bottom: 1px solid #2a2a4a; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 20px; color: #e0b040; }
        .header .refresh { color: #888; font-size: 13px; }
        .tabs { display: flex; background: #1a2332; border-bottom: 1px solid #2a2a4a; padding: 0 24px; gap: 4px; flex-wrap: wrap; }
        .tab { padding: 12px 20px; cursor: pointer; color: #888; font-size: 14px; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .tab:hover { color: #ccc; }
        .tab.active { color: #e0b040; border-bottom-color: #e0b040; }
        .tab-submit { color: #4ade80 !important; font-weight: 600; }
        .tab-submit.active { color: #4ade80 !important; border-bottom-color: #4ade80 !important; }
        .content { padding: 24px; }
        .panel { display: none; }
        .panel.active { display: block; }

        /* 提交面板 */
        .submit-form { max-width: 900px; }
        .form-row { margin-bottom: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .form-row label { font-size: 14px; color: #888; min-width: 80px; }
        .form-row input { padding: 10px 14px; background: #0f1923; border: 1px solid #2a2a4a; border-radius: 6px; color: #e0e0e0; font-size: 14px; outline: none; width: 200px; }
        .form-row input:focus { border-color: #4ade80; }
        .form-row textarea { width: 100%; min-height: 350px; padding: 16px; background: #0f1923; border: 1px solid #2a2a4a; border-radius: 8px; color: #e0e0e0; font-size: 14px; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; line-height: 1.8; outline: none; resize: vertical; }
        .form-row textarea:focus { border-color: #4ade80; }
        .form-row textarea::placeholder { color: #444; }
        .btn { padding: 10px 32px; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
        .btn-submit { background: #4ade80; color: #0f1923; }
        .btn-submit:hover { background: #22c55e; }
        .btn-submit:disabled { background: #1a3a24; color: #555; cursor: not-allowed; }
        .btn-quick { background: #2a2a4a; color: #ccc; }
        .btn-quick:hover { background: #3a3a5a; }
        .btn-group { display: flex; gap: 10px; }

        /* 结果面板 */
        .result-box { margin-top: 20px; background: #1a2332; border: 1px solid #2a2a4a; border-radius: 8px; padding: 20px; font-size: 13px; line-height: 1.9; white-space: pre-line; color: #bbb; max-height: 70vh; overflow-y: auto; }
        .result-stats { margin-top: 12px; padding: 10px 14px; background: #1a2a1a; border: 1px solid #2a4a2a; border-radius: 6px; font-size: 13px; color: #4ade80; }
        .loading { text-align: center; padding: 40px; color: #888; }
        .loading::after { content: '...'; animation: dots 1.5s infinite; }
        @keyframes dots { 0%,20% { content: '.'; } 40% { content: '..'; } 60%,100% { content: '...'; } }

        /* 卡片样式 */
        .card { background: #1a2332; border: 1px solid #2a2a4a; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
        .card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #2a2a4a; flex-wrap: wrap; }
        .card-title { font-size: 16px; font-weight: 600; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
        .badge-gold { background: #3d2a10; color: #e0b040; }
        .badge-green { background: #103d1c; color: #4ade80; }
        .badge-blue { background: #0f2a3d; color: #60a5fa; }
        .badge-red { background: #3d1015; color: #f87171; }
        .badge-gray { background: #2a2a2a; color: #999; }
        .badge-purple { background: #2d103d; color: #c084fc; }

        .info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
        .info-item { display: flex; gap: 8px; font-size: 13px; line-height: 1.6; }
        .info-label { color: #888; min-width: 70px; flex-shrink: 0; }
        .info-value { color: #ccc; }

        .event-content { font-size: 13px; line-height: 1.8; color: #bbb; margin: 8px 0; }

        .setting-group { margin-bottom: 20px; }
        .setting-group h3 { font-size: 15px; color: #e0b040; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #2a2a4a; }
        .setting-item { padding: 8px 0; border-bottom: 1px solid #1e2a3a; }
        .setting-name { font-size: 14px; font-weight: 600; color: #ccc; }
        .setting-detail { font-size: 12px; color: #888; margin-top: 2px; }

        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
        .status-unresolved { background: #f87171; }
        .status-progress { background: #fbbf24; }
        .status-resolved { background: #4ade80; }

        .timeline-item { padding: 10px 0; border-left: 2px solid #2a2a4a; padding-left: 16px; margin-left: 8px; position: relative; }
        .timeline-item::before { content: ''; position: absolute; left: -5px; top: 14px; width: 8px; height: 8px; border-radius: 50%; background: #e0b040; }
        .timeline-time { font-size: 12px; color: #888; }
        .timeline-desc { font-size: 13px; color: #ccc; margin-top: 2px; }

        .search-bar { margin-bottom: 16px; }
        .search-bar input { width: 100%; padding: 10px 14px; background: #0f1923; border: 1px solid #2a2a4a; border-radius: 6px; color: #e0e0e0; font-size: 14px; outline: none; }
        .search-bar input:focus { border-color: #e0b040; }

        .protagonist { background: linear-gradient(135deg, #2d1f10, #1a2332) !important; border-color: #e0b040 !important; }
        .protagonist .card-title::before { content: '★ '; color: #e0b040; }

        .summary-text { font-size: 13px; line-height: 1.8; white-space: pre-line; color: #bbb; }

        .empty-state { text-align: center; padding: 60px 20px; color: #555; }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        .counter { font-size: 12px; color: #666; margin-left: 8px; }

        /* 提示 */
        .hint { font-size: 12px; color: #555; margin-top: 6px; }

        /* 小说选择器 */
        .novel-btn { background: #2a2a4a; border: 1px solid #3a3a5a; border-radius: 6px; padding: 6px 14px; color: #ccc; font-size: 13px; cursor: pointer; }
        .novel-btn:hover { background: #3a3a5a; }
        .novel-menu { position: absolute; top: 100%; right: 0; margin-top: 4px; background: #1a2332; border: 1px solid #2a2a4a; border-radius: 8px; min-width: 220px; z-index: 100; overflow: hidden; }
        .novel-menu-item { padding: 10px 16px; cursor: pointer; font-size: 13px; color: #ccc; border-bottom: 1px solid #1e2a3a; display: flex; justify-content: space-between; align-items: center; }
        .novel-menu-item:hover { background: #2a2a4a; }
        .novel-menu-item.active { color: #4ade80; }
        .novel-menu-footer { padding: 8px; display: flex; gap: 6px; }
        .novel-menu-footer input { flex: 1; padding: 6px 10px; background: #0f1923; border: 1px solid #2a2a4a; border-radius: 4px; color: #e0e0e0; font-size: 12px; outline: none; }
        .novel-menu-footer input:focus { border-color: #4ade80; }
        .btn-import { background: #1a3a2a; border: 1px solid #2a5a3a; color: #4ade80; }
        .btn-import:hover { background: #2a5a3a; }

        /* 进度条 */
        .progress-bar { flex: 1; height: 8px; background: #1e2a3a; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #4ade80, #22c55e); border-radius: 4px; transition: width 0.3s; }

        /* 配置弹窗 */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 999; display: flex; align-items: center; justify-content: center; }
        .modal-overlay.hidden { display: none; }
        .modal-box { background: #1a2332; border: 1px solid #3a3a5a; border-radius: 12px; padding: 32px; max-width: 460px; width: 90%; }
        .modal-box h2 { font-size: 20px; color: #e0b040; margin-bottom: 6px; }
        .modal-box .subtitle { font-size: 13px; color: #888; margin-bottom: 20px; }
        .modal-box .field { margin-bottom: 14px; }
        .modal-box .field label { display: block; font-size: 13px; color: #888; margin-bottom: 4px; }
        .modal-box .field input, .modal-box .field select { width: 100%; padding: 10px 14px; background: #0f1923; border: 1px solid #2a2a4a; border-radius: 6px; color: #e0e0e0; font-size: 14px; outline: none; }
        .modal-box .field input:focus, .modal-box .field select:focus { border-color: #4ade80; }
        .modal-box .field input { font-family: monospace; }
        .modal-box .btn-row { display: flex; gap: 10px; margin-top: 20px; }
        .modal-box .btn-save { flex: 1; padding: 12px; background: #4ade80; border: none; border-radius: 6px; color: #0f1923; font-size: 15px; font-weight: 600; cursor: pointer; }
        .modal-box .btn-save:hover { background: #22c55e; }
        .modal-box .btn-skip { padding: 12px 20px; background: transparent; border: 1px solid #3a3a5a; border-radius: 6px; color: #888; font-size: 13px; cursor: pointer; }
        .modal-box .btn-skip:hover { color: #ccc; }
        .modal-box .error-msg { font-size: 12px; color: #f87171; margin-top: 8px; display: none; }
        .modal-box .env-hint { font-size: 12px; color: #555; margin-top: 4px; }

        /* Toast */
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; background: #1a2a1a; color: #4ade80; padding: 12px 24px; border-radius: 8px; font-size: 14px; border: 1px solid #2a4a2a; animation: toastIn 0.3s ease; }
        .toast.fadeout { animation: toastOut 0.3s ease forwards; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }
    </style>
</head>
<body>
    <!-- 首次配置弹窗 -->
    <div class="modal-overlay hidden" id="config-modal">
        <div class="modal-box">
            <h2>⚙️ 首次配置</h2>
            <div class="subtitle">请填入你的 API Key 以开始使用</div>
            <div class="field">
                <label>服务商</label>
                <select id="modal-provider" onchange="onModalProviderChange()">
                    <option value="deepseek">DeepSeek</option>
                    <option value="tongyi">通义千问</option>
                    <option value="zhipu">智谱 GLM</option>
                    <option value="openai">OpenAI</option>
                    <option value="custom">自定义 (OpenAI 兼容)</option>
                </select>
            </div>
            <div class="field" id="modal-custom-fields" style="display:none;">
                <label>接口地址 (base_url)</label>
                <input type="text" id="modal-baseurl" placeholder="https://api.example.com/v1">
                <label style="margin-top:10px;">模型名</label>
                <input type="text" id="modal-model" placeholder="gpt-3.5-turbo / moonshot-v1-8k …">
            </div>
            <div class="field">
                <label>API Key</label>
                <input type="password" id="modal-apikey" placeholder="sk-xxxxxxxxxxxxxxxx 或留空使用环境变量">
                <div class="env-hint">已通过环境变量设置？<a href="#" onclick="document.getElementById('config-modal').classList.add('hidden');return false;" style="color:#4ade80;">跳过</a></div>
            </div>
            <div class="error-msg" id="modal-error"></div>
            <div class="btn-row">
                <button class="btn-save" onclick="submitModalConfig()">💾 保存并开始使用</button>
            </div>
        </div>
    </div>

    <div class="header">
        <h1>网文动态大纲</h1>
        <div style="display:flex;align-items:center;gap:12px;">
            <div style="position:relative;">
                <button class="novel-btn" id="novel-btn" onclick="toggleNovelMenu()">
                    📖 <span id="current-novel-name">默认小说</span> ▾
                </button>
                <div class="novel-menu" id="novel-menu" style="display:none;">
                    <div id="novel-list"></div>
                    <div class="novel-menu-footer">
                        <input type="text" id="new-novel-name" placeholder="新小说名..." 
                               onkeydown="if(event.key==='Enter')createNovel()">
                        <button class="btn-sm" onclick="createNovel()">+ 新建</button>
                    </div>
                </div>
            </div>
            <span class="refresh" id="refreshTime"></span>
        </div>
    </div>

    <div class="tabs">
        <div class="tab tab-submit active" data-tab="submit">✏️ 提交章节</div>
        <div class="tab" data-tab="status">概览</div>
        <div class="tab" data-tab="characters">角色</div>
        <div class="tab" data-tab="events">事件</div>
        <div class="tab" data-tab="settings">设定</div>
        <div class="tab" data-tab="foreshadowings">伏笔</div>
        <div class="tab" data-tab="timeline">时间线</div>
        <div class="tab" data-tab="conflicts">冲突</div>
        <div class="tab tab-config" data-tab="config">⚙️ 设置</div>
    </div>

    <div class="content">
        <!-- 提交章节 -->
        <div class="panel active" id="panel-submit">
            <div class="submit-form">
                <div class="form-row">
                    <label>章节范围</label>
                    <input type="text" id="chapter-range" placeholder="如：第2章 或 第2-4章" value="">
                    <label style="margin-left:20px;">主角</label>
                    <input type="text" id="protagonist" placeholder="主角名（首次必填）" value="">
                </div>
                <div class="form-row">
                    <textarea id="chapter-content" placeholder="在此粘贴章节正文...&#10;&#10;或点击下方按钮选择整本 txt 文件&#10;手动粘贴支持连续多章，系统会自动识别 '第X章' 分隔符"></textarea>
                </div>
                <div class="btn-group">
                    <button class="btn btn-submit" id="btn-submit" onclick="submitChapter('full')">提交分析（维护数据库）</button>
                    <button class="btn btn-quick" id="btn-quick" onclick="submitChapter('quick')">快速阅读（不存库）</button>
                </div>
                <div style="margin-top:12px;">
                    <input type="file" id="file-input" accept=".txt" style="display:none;" onchange="handleFileImport(event)">
                    <button class="btn btn-import" onclick="document.getElementById('file-input').click()">📂 整本导入（选择txt文件，自动分章逐批分析）</button>
                    <span class="hint" style="margin-left:12px;">每批3章，自动增量更新数据库</span>
                </div>
                <div id="import-progress" style="display:none;margin-top:12px;">
                    <div style="display:flex;align-items:center;gap:10px;">
                        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
                        <span id="progress-text" style="font-size:13px;color:#888;"></span>
                    </div>
                </div>
                <div id="result-container"></div>
            </div>
        </div>

        <!-- 概览 -->
        <div class="panel" id="panel-status">
            <div id="status-content" class="summary-text">加载中...</div>
        </div>

        <!-- 角色 -->
        <div class="panel" id="panel-characters">
            <div class="search-bar">
                <input type="text" id="char-search" placeholder="搜索角色..." oninput="filterCharacters()">
            </div>
            <div id="characters-content"></div>
        </div>

        <!-- 事件 -->
        <div class="panel" id="panel-events">
            <div id="events-content"></div>
        </div>

        <!-- 设定 -->
        <div class="panel" id="panel-settings">
            <div id="settings-content"></div>
        </div>

        <!-- 伏笔 -->
        <div class="panel" id="panel-foreshadowings">
            <div id="foreshadowings-content"></div>
        </div>

        <!-- 时间线 -->
        <div class="panel" id="panel-timeline">
            <div id="timeline-content"></div>
        </div>

        <!-- 冲突 -->
        <div class="panel" id="panel-conflicts">
            <div id="conflicts-content"></div>
        </div>

        <!-- 设置 -->
        <div class="panel" id="panel-config">
            <div class="card" style="max-width:600px;">
                <div class="card-header">
                    <span class="card-title">API 配置</span>
                    <span class="badge badge-green" id="config-status" style="display:none;">已配置</span>
                    <span class="badge badge-red" id="config-status-empty" style="display:none;">未配置</span>
                </div>
                <div style="display:flex;flex-direction:column;gap:14px;">
                    <div>
                        <label style="font-size:13px;color:#888;">服务商</label>
                        <div style="display:flex;gap:8px;margin-top:6px;">
                            <select id="config-provider" onchange="onConfigProviderChange()" style="padding:8px 12px;background:#0f1923;border:1px solid #2a2a4a;border-radius:6px;color:#e0e0e0;font-size:14px;outline:none;flex:1;">
                                <option value="deepseek">DeepSeek</option>
                                <option value="tongyi">通义千问</option>
                                <option value="zhipu">智谱 GLM</option>
                                <option value="openai">OpenAI</option>
                                <option value="custom">自定义 (OpenAI 兼容)</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label style="font-size:13px;color:#888;">模型</label>
                        <input type="text" id="config-model" placeholder="deepseek-chat" style="width:100%;padding:10px 14px;background:#0f1923;border:1px solid #2a2a4a;border-radius:6px;color:#e0e0e0;font-size:14px;outline:none;margin-top:6px;">
                    </div>
                    <div id="config-baseurl-row">
                        <label style="font-size:13px;color:#888;">接口地址 (base_url)</label>
                        <input type="text" id="config-baseurl" placeholder="https://api.example.com/v1" style="width:100%;padding:10px 14px;background:#0f1923;border:1px solid #2a2a4a;border-radius:6px;color:#e0e0e0;font-size:14px;outline:none;margin-top:6px;font-family:monospace;">
                        <div class="hint" style="margin-top:4px;">仅“自定义”必填，例如 https://api.moonshot.cn/v1、http://localhost:11434/v1 (Ollama)</div>
                    </div>
                    <div>
                        <label style="font-size:13px;color:#888;">API Key</label>
                        <input type="password" id="config-apikey" placeholder="sk-xxxxxxxx" style="width:100%;padding:10px 14px;background:#0f1923;border:1px solid #2a2a4a;border-radius:6px;color:#e0e0e0;font-size:14px;outline:none;margin-top:6px;font-family:monospace;">
                        <div class="hint" style="margin-top:4px;">支持环境变量，无需填写：DEEPSEEK_API_KEY / DASHSCOPE_API_KEY / ZHIPU_API_KEY / OPENAI_API_KEY</div>
                    </div>
                    <button class="btn btn-submit" onclick="saveConfig()" style="align-self:flex-start;">💾 保存配置</button>
                    <button class="btn" onclick="testConfig()" style="align-self:flex-start;background:#1a3a2a;color:#4ade80;border:1px solid #2a5a4a;">测试连接</button>
                    <div id="config-msg" style="font-size:13px;padding:8px;border-radius:6px;display:none;"></div>
                    <div id="config-test" style="font-size:13px;padding:10px;border-radius:6px;display:none;margin-top:6px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let charactersData = [];

        // Tab 切换
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
            });
        });

        // ---- 小说管理 ----
        async function loadNovels() {
            const resp = await fetch('/api/novels');
            const data = await resp.json();
            document.getElementById('current-novel-name').textContent = data.current;
            const list = document.getElementById('novel-list');
            list.innerHTML = data.novels.map(n => `
                <div class="novel-menu-item ${n.name === data.current ? 'active' : ''}" 
                     onclick="switchNovel('${n.name}')">
                    <span>📖 ${n.name}</span>
                    ${n.protagonist ? `<span style="font-size:11px;color:#888;">${n.protagonist}</span>` : ''}
                    <button class="btn-sm" style="margin-left:auto;background:#3d1015;color:#f87171;font-size:10px;padding:2px 6px;" 
                            onclick="event.stopPropagation();deleteNovel('${n.name}')">🗑</button>
                </div>
            `).join('');
            if (data.novels.length === 0) {
                list.innerHTML = '<div style="padding:12px;color:#555;font-size:12px;">暂无其他小说</div>';
            }
        }

        function toggleNovelMenu() {
            const menu = document.getElementById('novel-menu');
            menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
            if (menu.style.display === 'block') loadNovels();
        }

        async function switchNovel(name) {
            await fetch('/api/novels/switch', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: name})
            });
            document.getElementById('novel-menu').style.display = 'none';
            loadAll();
            loadNovels();
        }

        async function createNovel() {
            const input = document.getElementById('new-novel-name');
            const name = input.value.trim();
            if (!name) return;
            const resp = await fetch('/api/novels/create', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: name})
            });
            const data = await resp.json();
            if (data.ok) {
                input.value = '';
                document.getElementById('novel-menu').style.display = 'none';
                loadAll();
                loadNovels();
            } else {
                alert(data.error);
            }
        }

        async function deleteNovel(name) {
            if (!confirm(`确定要删除小说「${name}」吗？\n\n这将删除该小说的所有大纲数据和数据库文件，不可恢复！`)) return;
            const resp = await fetch('/api/novels/delete', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: name})
            });
            const data = await resp.json();
            if (data.ok) {
                document.getElementById('current-novel-name').textContent = data.current;
                document.getElementById('novel-menu').style.display = 'none';
                loadAll();
                loadNovels();
            } else {
                alert(data.error);
            }
        }

        // 点击其他地方关闭菜单
        document.addEventListener('click', e => {
            const menu = document.getElementById('novel-menu');
            const btn = document.getElementById('novel-btn');
            if (!btn.contains(e.target) && !menu.contains(e.target)) {
                menu.style.display = 'none';
            }
        });

        // ---- 整本导入 ----
        let _importing = false;
        window.addEventListener('beforeunload', e => {
            if (_importing) {
                e.preventDefault();
                e.returnValue = '整本导入正在进行中，离开页面将中断导入。（重新打开后可继续导入）';
            }
        });

        async function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const content = e.target.result;
                const protagonist = document.getElementById('protagonist').value.trim();

                _importing = true;
                // 显示进度条
                const progressDiv = document.getElementById('import-progress');
                const progressFill = document.getElementById('progress-fill');
                const progressText = document.getElementById('progress-text');
                const resultContainer = document.getElementById('result-container');
                progressDiv.style.display = 'block';
                resultContainer.innerHTML = '';

                // 先获取总批次数
                progressText.textContent = '正在解析章节...';
                progressFill.style.width = '5%';

                try {
                    // 先解析一次本地获取章节数
                    const chapterCount = (content.match(/第\d+章/g) || []).length || 1;
                    const estimatedBatches = Math.ceil(chapterCount / 3);

                    progressText.textContent = `共约 ${chapterCount} 章，${estimatedBatches} 批，开始分析...`;

                    const resp = await fetch('/api/import', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            content: content,
                            batch_size: 3,
                            notes: protagonist ? '主角：' + protagonist : '',
                        })
                    });
                    const data = await resp.json();

                    if (!data.ok) {
                        resultContainer.innerHTML = `<div class="result-box" style="color:#f87171;">错误：${data.error}</div>`;
                        progressDiv.style.display = 'none';
                        return;
                    }

                    progressFill.style.width = '100%';
                    progressText.textContent = `完成！共 ${data.total_chapters} 章，${data.total_batches} 批`;

                    // 检查是否有数据实际写入
                    const totalOps = data.total_stats.added + data.total_stats.updated + data.total_stats.archived + data.total_stats.locked + data.total_stats.conflicts;
                    const allNoDbOps = data.results.every(r => r.no_db_ops);

                    // 显示汇总
                    let summaryColor = totalOps > 0 ? '#4ade80' : '#fbbf24';
                    let summaryBg = totalOps > 0 ? '#1a2a1a' : '#2a2a1a';
                    let summaryHtml = `<div style="margin-top:16px;padding:12px;background:${summaryBg};border-radius:6px;color:${summaryColor};">
                        <strong>整本导入完成！</strong> 
                        共 ${data.total_chapters} 章，${data.total_batches} 批次 |
                        新增 ${data.total_stats.added} | 更新 ${data.total_stats.updated} | 
                        归档 ${data.total_stats.archived} | 锁定 ${data.total_stats.locked}
                    </div>`;

                    if (allNoDbOps) {
                        summaryHtml += `<div style="margin-top:8px;padding:12px;background:#3a2a1a;border-radius:6px;color:#fbbf24;border:1px solid #5a4a1a;">
                            <strong>⚠️ 警告：LLM 未返回有效的数据库操作 JSON</strong><br>
                            <span style="font-size:13px;color:#888;">分析文本已生成，但未提取到结构化数据。请检查：<br>
                            1. config.yaml 中 API Key 是否正确<br>
                            2. LLM 服务是否正常响应<br>
                            3. 章节内容是否包含可提取的角色/事件/设定信息</span>
                        </div>`;
                    } else if (totalOps === 0) {
                        summaryHtml += `<div style="margin-top:8px;padding:12px;background:#2a2a1a;border-radius:6px;color:#fbbf24;border:1px solid #5a4a1a;">
                            <strong>⚠️ 注意：本次导入未提取到新数据</strong><br>
                            <span style="font-size:13px;color:#888;">可能原因：章节内容中无新增角色/事件/设定，或 LLM 返回数据为空</span>
                        </div>`;
                    }

                    // 折叠显示各批次结果
                    data.results.forEach((r, i) => {
                        const id = `batch-${i}-${Date.now()}`;
                        const hasError = r.error;
                        const headerStyle = hasError ? 'background:#3a1a1a;' : '';
                        summaryHtml += `
                            <div class="card" style="margin-top:8px;">
                                <div class="card-header" style="cursor:pointer;${headerStyle}" onclick="document.getElementById('${id}').style.display=document.getElementById('${id}').style.display==='none'?'block':'none'">
                                    <span class="card-title">📑 ${r.chapter_range}</span>
                                    <span class="badge ${hasError ? 'badge-red' : 'badge-green'}">第${r.batch}/${r.total_batches}批</span>
                                    ${r.stats && r.stats.added !== undefined ? `<span style="font-size:11px;color:#888;">新增${r.stats.added} 更新${r.stats.updated}</span>` : ''}
                                    <span style="font-size:11px;color:#888;margin-left:8px;">点击展开/折叠</span>
                                </div>
                                <div id="${id}" style="display:none;" class="event-content">${hasError ? `<div style="color:#f87171;padding:8px;">❌ ${r.error}</div>` : r.result}</div>
                            </div>`;
                    });

                    resultContainer.innerHTML = summaryHtml;
                    loadAll();

                    _importing = false;
                    progressDiv.style.display = 'none';
                    event.target.value = '';

                } catch(e) {
                    resultContainer.innerHTML = `<div class="result-box" style="color:#f87171;">请求失败：${e.message}</div>`;
                    _importing = false;
                    progressDiv.style.display = 'none';
                    event.target.value = '';
                }
            };
            reader.readAsText(file);
        }
        // ---- 章节提交 ----
        async function submitChapter(mode) {
            const content = document.getElementById('chapter-content').value.trim();
            const chapterRange = document.getElementById('chapter-range').value.trim();
            const protagonist = document.getElementById('protagonist').value.trim();

            if (!content) { alert('请粘贴章节正文'); return; }

            const btnSubmit = document.getElementById('btn-submit');
            const btnQuick = document.getElementById('btn-quick');
            const container = document.getElementById('result-container');

            btnSubmit.disabled = true;
            btnQuick.disabled = true;
            container.innerHTML = '<div class="loading">AI 正在分析章节</div>';

            try {
                const resp = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: content,
                        chapter_range: chapterRange,
                        notes: protagonist ? '主角：' + protagonist : '',
                        mode: mode,
                    })
                });
                const data = await resp.json();

                if (!data.ok) {
                    container.innerHTML = `<div class="result-box" style="color:#f87171;">错误：${data.error}</div>`;
                } else {
                    container.innerHTML = `
                        <div class="result-box">${data.result}</div>
                        ${data.stats && Object.keys(data.stats).length > 0 ? `<div class="result-stats">数据库已更新：${JSON.stringify(data.stats)}</div>` : ''}
                    `;
                    // 清除输入
                    document.getElementById('chapter-content').value = '';
                    document.getElementById('chapter-range').value = '';
                    // 刷新所有面板
                    loadAll();
                }
            } catch(e) {
                container.innerHTML = `<div class="result-box" style="color:#f87171;">请求失败：${e.message}</div>`;
            } finally {
                btnSubmit.disabled = false;
                btnQuick.disabled = false;
            }
        }

                    </div>` : '';

                <div class="${cls}" data-name="${c.name}">
                    <div class="card-header">

                        <div class="info-item"><span class="info-label">阵营</span><span class="info-value">${c.faction || '无'}</span></div>
                        <div class="info-item"><span class="info-label">职位</span><span class="info-value">${c.current_position || '-'}</span></div>
                        <div class="info-item"><span class="info-label">位置</span><span class="info-value">${c.current_location || '未知'}</span></div>
                        <div class="info-item"><span class="info-label">生死</span><span class="info-value">${c.life_death_status || '存活'}</span></div>
                        <div class="info-item"><span class="info-label">身体</span><span class="info-value">${c.physical_status || '正常'}</span></div>
                        <div class="info-item"><span class="info-label">性格</span><span class="info-value">${c.personality || '-'}</span></div>
                        <div class="info-item"><span class="info-label">目标</span><span class="info-value">${c.core_goal || '-'}</span></div>
                        <div class="info-item"><span class="info-label">与主角关系</span><span class="info-value">${c.relationship_with_protagonist || '-'}</span></div>
                        <div class="info-item"><span class="info-label">首次登场</span><span class="info-value">${c.first_appearance || '-'}</span></div>
                        ${aliasesHtml}
                    </div>
                    ${changesHtml}
                </div>`;
            }).join('');
        }

                        <span class="badge ${statusCls}">${e.status}</span>
                        ${e.narrative_type ? `<span class="badge badge-purple">${e.narrative_type}${e.narrative_subtype ? ' - ' + e.narrative_subtype : ''}</span>` : ''}

                    <div class="event-content">${e.story_content || '暂无内容'}</div>

        async function loadSettings() {
            const resp = await fetch('/api/settings');
            const data = await resp.json();
            const container = document.getElementById('settings-content');
            if (!data.settings || data.settings.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="icon">🌍</div>暂无世界观设定</div>';
                return;
            }
            const groups = {};
            data.settings.forEach(s => {
                if (!groups[s.category]) groups[s.category] = [];
                groups[s.category].push(s);
            });
            let html = '';
            for (const [cat, items] of Object.entries(groups)) {
                html += `<div class="setting-group"><h3>${cat} <span class="counter">${items.length}条</span></h3>`;
                items.forEach(s => {
                    const credCls = s.credibility === '客观事实' ? 'badge-green' : s.credibility === '作者设定' ? 'badge-gold' : s.credibility === '角色认知' ? 'badge-blue' : 'badge-gray';
                    html += `
                    <div class="setting-item">
                        <div class="setting-name">${s.name} <span class="badge ${credCls}">${s.credibility}</span></div>
                        <div class="setting-detail">${s.content} | 首次: ${s.first_appearance || '?'} | 最近: ${s.last_confirmed || '?'}</div>
                    </div>`;
                });
                html += '</div>';
            }
            container.innerHTML = html;
        }

        async function submitModalConfig() {
            const apiKey = document.getElementById('modal-apikey').value.trim();
            const provider = document.getElementById('modal-provider').value;
            const errorEl = document.getElementById('modal-error');
            const DEFAULT_MODELS = { deepseek: 'deepseek-chat', tongyi: 'qwen-plus', zhipu: 'glm-4', openai: 'gpt-4o', custom: '' };
            const modelEl = document.getElementById('modal-model');
            const baseUrlEl = document.getElementById('modal-baseurl');
            const modelInput = (modelEl && modelEl.value.trim()) || DEFAULT_MODELS[provider] || 'deepseek-chat';
            const baseUrlInput = (baseUrlEl && baseUrlEl.value.trim()) || '';

            if (provider === 'custom') {
                if (!baseUrlInput) { errorEl.textContent = '请填写接口地址 base_url'; errorEl.style.display = 'block'; return; }
                if (!modelInput) { errorEl.textContent = '请填写模型名'; errorEl.style.display = 'block'; return; }
            } else if (!apiKey) {
                errorEl.textContent = '请输入 API Key';
                errorEl.style.display = 'block';
                return;
            }

            const body = { api_key: apiKey, provider: provider, model: modelInput };
            if (baseUrlInput) body.base_url = baseUrlInput;

            try {
                const resp = await fetch('/api/config', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(body)
                });
                const data = await resp.json();
                if (data.ok) {
                    document.getElementById('config-modal').classList.add('hidden');
                    document.getElementById('config-provider').value = provider;
                    document.getElementById('config-model').value = modelInput;
                    if (baseUrlInput) document.getElementById('config-baseurl').value = baseUrlInput;
                    onConfigProviderChange();
                    document.getElementById('config-status').style.display = 'inline-block';
                    document.getElementById('config-status-empty').style.display = 'none';
                    showToast('配置已保存！请重启服务后生效。');
                } else {
                    errorEl.textContent = data.error;
                    errorEl.style.display = 'block';
                }
            } catch(e) {
                errorEl.textContent = '保存失败：' + e.message;
                errorEl.style.display = 'block';
            }
        }

        async function saveConfig() {
            const apiKey = document.getElementById('config-apikey').value.trim();
            const provider = document.getElementById('config-provider').value;
            const model = document.getElementById('config-model').value.trim();
            const baseUrl = document.getElementById('config-baseurl').value.trim();
            const msg = document.getElementById('config-msg');

            if (provider === 'custom') {
                if (!baseUrl) { msg.style.display='block'; msg.style.background='#3a1a1a'; msg.style.color='#f87171'; msg.textContent='❌ 自定义 provider 必须填写 base_url'; return; }
                if (!model) { msg.style.display='block'; msg.style.background='#3a1a1a'; msg.style.color='#f87171'; msg.textContent='❌ 请填写模型名'; return; }
            } else if (!apiKey && !confirm('API Key 为空。如果使用环境变量则无需填写，确定保存空配置吗？')) {
                return;
            }

            const body = { api_key: apiKey, provider: provider, model: model };
            if (baseUrl) body.base_url = baseUrl;

            try {
                const resp = await fetch('/api/config', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(body)
                });
                const data = await resp.json();
                msg.style.display = 'block';
                if (data.ok) {
                    msg.style.background = '#1a2a1a';
                    msg.style.color = '#4ade80';
                    msg.textContent = '✅ ' + data.message + '（需重启服务生效）';
                    document.getElementById('config-status').style.display = 'inline-block';
                    document.getElementById('config-status-empty').style.display = 'none';
                } else {
                    msg.style.background = '#3a1a1a';
                    msg.style.color = '#f87171';
                    msg.textContent = '❌ ' + data.error;
                }
            } catch(e) {
                msg.style.display = 'block';
                msg.style.background = '#3a1a1a';
                msg.style.color = '#f87171';
                msg.textContent = '❌ 保存失败：' + e.message;
            }
        }

        async function testConfig() {
            const box = document.getElementById('config-test');
            box.style.display = 'block';
            box.style.background = '#1a2a3a';
            box.style.color = '#93c5fd';
            box.textContent = '正在测试连接...';
            try {
                const resp = await fetch('/api/test_config', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({}) });
                const data = await resp.json();
                const esc = s => String(s||'').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
                if (data.ok) {
                    box.style.background = '#1a2a1a';
                    box.style.color = '#4ade80';
                    box.innerHTML = 'OK ' + esc(data.message) + '<br><span style="font-size:12px;color:#888;">provider=' + esc(data.provider) + ' model=' + esc(data.model) + ' base_url=' + esc(data.base_url) + '</span><br><span style="font-size:12px;color:#888;">reply: ' + esc(data.sample) + '</span>';
                } else {
                    box.style.background = '#3a1a1a';
                    box.style.color = '#f87171';
                    box.innerHTML = 'FAIL ' + esc(data.error) + '<br><details style="margin-top:6px;"><summary style="cursor:pointer;color:#888;">stack</summary><pre style="font-size:11px;color:#888;white-space:pre-wrap;">' + esc(data.traceback) + '</pre></details>';
                }
            } catch(e) {
                box.style.background = '#3a1a1a';
                box.style.color = '#f87171';
                box.textContent = 'FAIL request error: ' + e.message;
            }
        }

    </script>
</body>
</html>
